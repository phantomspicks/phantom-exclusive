<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phantom Command Center</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:950px;margin:auto}.admin h1{color:#e8ad17}.form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;background:#0b0b0c;border:1px solid #5f4917;padding:18px;border-radius:16px}.form input,.form select{background:#111;color:#fff;border:1px solid #333;padding:11px;border-radius:7px}.form button,.actions button{background:#e8ad17;border:0;padding:11px;border-radius:7px;font-weight:800}.admin table{margin-top:20px}.actions{display:flex;gap:5px}.actions button{padding:6px 8px;font-size:10px}.danger{background:#6d1713!important;color:#fff}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.admin table{min-width:720px}}</style></head><body><main class="admin"><h1>PHANTOM COMMAND CENTER</h1><p>Post, grade, edit or delete Exclusive Drops. Pending plays stay hidden publicly; once settled, the exact pick name is shown in the Phantom Ledger.</p><div class="form"><input id="date" placeholder="AUG 13"><input id="play" placeholder="Exact pick (e.g. Player O 22.5 PTS)"><input id="units" type="number" value="5" step=".5"><select id="result"><option>PENDING</option><option>WIN</option><option>LOSS</option><option>PUSH</option></select><input id="profitInput" type="number" placeholder="Profit $"><button id="add">POST DROP</button></div><div class="table-wrap"><table><thead><tr><th>DATE</th><th>PLAY</th><th>UNITS</th><th>RESULT</th><th>PROFIT</th><th>ACTIONS</th></tr></thead><tbody id="adminRows"></tbody></table></div><p><a href="index.html" style="color:#e8ad17">← Public View</a></p></main><script>
const KEY='phantomExclusiveDrops';const seed=[{id:1,date:'AUG 13',play:'Exclusive Play',units:5,result:'PENDING',profit:null},{id:2,date:'AUG 12',play:'Exclusive Play',units:5,result:'WIN',profit:10000},{id:3,date:'AUG 11',play:'Exclusive Play',units:5,result:'WIN',profit:10000},{id:4,date:'AUG 10',play:'Exclusive Play',units:5,result:'LOSS',profit:-10000},{id:5,date:'AUG 09',play:'Exclusive Play',units:5,result:'PUSH',profit:0}];function get(){return JSON.parse(localStorage.getItem(KEY)||'null')||seed}function save(d){localStorage.setItem(KEY,JSON.stringify(d));render()}function render(){adminRows.innerHTML=get().map((x,i)=>`<tr><td>${x.date}</td><td>${x.play}</td><td>${x.units}U</td><td>${x.result}</td><td>${x.profit??'—'}</td><td><div class=actions><button onclick="grade(${i},'WIN')">WIN</button><button onclick="grade(${i},'LOSS')">LOSS</button><button onclick="grade(${i},'PUSH')">PUSH</button><button onclick="editDrop(${i})">EDIT</button><button class=danger onclick="del(${i})">DELETE</button></div></td></tr>`).join('')}window.grade=(i,r)=>{let d=get();let x=d[i];if((!x.play||x.play==='Exclusive Play')&&r!=='PENDING'){const settled=prompt('Enter the exact settled pick so it appears in the public ledger (example: Player O 22.5 PTS):','');if(settled===null)return;if(!settled.trim()){alert('Add the actual pick before settling this drop.');return;}x.play=settled.trim();}x.result=r;if(r==='PUSH')x.profit=0;else if(x.profit==null)x.profit=r==='WIN'?x.units*2000:-x.units*2000;save(d)};window.del=i=>{let d=get();if(confirm('Delete this drop?')){d.splice(i,1);save(d)}};window.editDrop=i=>{let d=get(),x=d[i];let p=prompt('Play',x.play);if(p===null)return;let u=prompt('Units',x.units);let pr=prompt('Profit $ (blank for pending)',x.profit??'');x.play=p;x.units=Number(u)||x.units;x.profit=pr===''?null:Number(pr);save(d)};add.onclick=()=>{let d=get();d.unshift({id:Date.now(),date:date.value||new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit'}).toUpperCase(),play:play.value.trim()||'Exclusive Play',units:Number(units.value)||5,result:result.value,profit:profitInput.value===''?null:Number(profitInput.value)});save(d);profitInput.value=''};render();</script></body></html>
